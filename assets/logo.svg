<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- Shield background -->
  <path d="M8 4 L28 4 L28 32 Q28 44 18 50 Q8 44 8 32 Z" fill="#1a56db"/>
  <path d="M10 6 L26 6 L26 31.5 Q26 42 18 47.5 Q10 42 10 31.5 Z" fill="#1e40af"/>

  <!-- Truck body on shield -->
  <rect x="11" y="20" width="10" height="7" rx="1" fill="white" opacity="0.95"/>
  <rect x="21" y="22" width="5" height="5" rx="0.5" fill="white" opacity="0.95"/>
  <!-- Cab window -->
  <rect x="22" y="23" width="3" height="2.5" rx="0.3" fill="#1a56db"/>
  <!-- Wheels -->
  <circle cx="14" cy="28" r="1.5" fill="#1a56db"/>
  <circle cx="14" cy="28" r="0.7" fill="white"/>
  <circle cx="23" cy="28" r="1.5" fill="#1a56db"/>
  <circle cx="23" cy="28" r="0.7" fill="white"/>
  <!-- Road line -->
  <line x1="10" y1="29.5" x2="26" y2="29.5" stroke="white" stroke-width="0.6" opacity="0.5"/>

  <!-- CPARS text -->
  <text x="36" y="28" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="22" fill="#1e293b" letter-spacing="-0.5">CPARS</text>

  <!-- Tagline -->
  <text x="37" y="42" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="9.5" fill="#64748b" letter-spacing="2.5">TRANSPORTATION LLC</text>

  <!-- Accent line under CPARS -->
  <rect x="36" y="31" width="88" height="2" rx="1" fill="#1a56db" opacity="0.15"/>
</svg>
